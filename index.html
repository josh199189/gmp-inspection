<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GMP 유틸리티 점검</title>
<style>
:root{--pri:#2563eb;--bg:#f0f4f8;--card:#fff;--txt:#1e293b;--sub:#64748b;--bdr:#e2e8f0;--ok:#22c55e;--off:#ef4444;--rad:14px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;color:var(--txt);background:var(--bg);min-height:100dvh}
button{font-family:inherit}

/* 페이지 */
.page{display:none;min-height:100dvh;flex-direction:column}
.page.on{display:flex}

/* 로그인 */
#pg-login{justify-content:center;align-items:center;padding:24px;background:linear-gradient(135deg,#1e3a5f,#2563eb)}
.lbox{background:#fff;border-radius:20px;padding:32px 24px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.lbox h1{font-size:22px;text-align:center;margin-bottom:4px}
.lbox p{text-align:center;color:var(--sub);font-size:13px;margin-bottom:20px}
.fg{display:flex;flex-direction:column;gap:10px}
.fg input{padding:14px 16px;border:1.5px solid var(--bdr);border-radius:12px;font-size:15px;outline:none}
.fg input:focus{border-color:var(--pri)}
.btn{padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer}
.btn1{background:var(--pri);color:#fff}
.btn1:active{opacity:.85}
.btn2{background:#f1f5f9;color:#475569}
.emsg{color:var(--off);font-size:13px;text-align:center;min-height:18px;margin-top:2px}

/* 헤더 */
.hdr{background:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--bdr);position:sticky;top:0;z-index:100}
.hdr h2{font-size:17px;flex:1}
.hb{width:36px;height:36px;border:none;background:#f1f5f9;border-radius:10px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* 층 전환 */
.fsw{display:flex;background:#f1f5f9;border-radius:10px;padding:3px;margin:10px 16px 0}
.fsw button{flex:1;padding:10px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;background:transparent;color:var(--sub)}
.fsw button.on{background:#fff;color:var(--pri);box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* 진행률 */
.pcard{margin:10px 16px;background:#fff;border-radius:var(--rad);padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.prow{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.pbig{font-size:32px;font-weight:700;color:var(--pri)}
.psub{font-size:13px;color:var(--sub)}
.pbar{height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden}
.pfill{height:100%;background:linear-gradient(90deg,var(--pri),#60a5fa);border-radius:4px;transition:width .4s}

/* 탭 */
.tabs{display:flex;margin:10px 16px 0;gap:4px}
.tab{flex:1;padding:10px;border:none;border-radius:10px 10px 0 0;font-size:14px;font-weight:600;cursor:pointer;background:#e2e8f0;color:var(--sub)}
.tab.on{background:#fff;color:var(--pri)}

/* 도면 */
#mapBox{flex:1;background:#fff;position:relative;overflow:hidden;touch-action:none}
#mc{display:block;width:100%}

/* 목록 */
#listBox{flex:1;background:#fff;overflow-y:auto;padding-bottom:80px;display:none}
.csec{border-bottom:1px solid var(--bdr)}
.chdr{padding:14px 16px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;cursor:pointer;background:#fafbfc}
.chdr .a{font-size:11px;color:var(--sub);transition:transform .2s}
.chdr.op .a{transform:rotate(90deg)}
.chdr .n{margin-left:auto;font-size:12px;color:var(--sub);font-weight:400}
.cbod{display:none}.cbod.op{display:block}
.irow{display:flex;align-items:center;padding:12px 16px 12px 28px;border-top:1px solid #f1f5f9;gap:10px}
.irow .nm{flex:1;font-size:14px}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dot{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;cursor:pointer}
.dot.don{background:var(--ok)}.dot.doff{background:var(--off)}.dot.dnone{background:#cbd5e1;color:#64748b}
.iadm{display:flex;gap:4px}
.iadm button{padding:4px 8px;border:none;border-radius:6px;font-size:11px;cursor:pointer;background:#f1f5f9;color:var(--sub)}

/* 맵 툴바 */
.mtb{position:absolute;bottom:16px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:10}
.mtb button{width:44px;height:44px;border:none;border-radius:12px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15);font-size:20px;cursor:pointer}

/* 팝업 */
.popup{position:absolute;z-index:50;background:#fff;border-radius:14px;padding:14px;box-shadow:0 8px 30px rgba(0,0,0,.2);min-width:200px;display:none}
.popup.show{display:block}
.popup h4{font-size:14px;margin-bottom:8px}
.pbtn{display:flex;gap:6px;margin-top:8px}
.pbtn button{flex:1;padding:8px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}

/* FAB */
.fab{position:fixed;bottom:20px;left:20px;width:56px;height:56px;border-radius:16px;background:var(--pri);color:#fff;border:none;font-size:24px;box-shadow:0 4px 16px rgba(37,99,235,.4);cursor:pointer;z-index:90;display:none}

/* 설정 */
.spage{padding:16px;display:flex;flex-direction:column;gap:12px;padding-bottom:80px;overflow-y:auto;flex:1}
.scard{background:#fff;border-radius:var(--rad);padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.scard h3{font-size:15px;margin-bottom:10px}
.scard input{width:100%;padding:12px;border:1.5px solid var(--bdr);border-radius:10px;font-size:14px;margin-bottom:8px}
.sbtn{display:flex;gap:8px;flex-wrap:wrap}
.sbtn .btn{font-size:13px;padding:10px 16px}

/* 모달 */
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:none;align-items:center;justify-content:center;padding:24px}
.mbg.show{display:flex}
.mdl{background:#fff;border-radius:20px;padding:24px;width:100%;max-width:360px}
.mdl h3{font-size:17px;margin-bottom:16px}
.mdl input,.mdl select{width:100%;padding:12px;border:1.5px solid var(--bdr);border-radius:10px;font-size:14px;margin-bottom:12px}
.mflex{display:flex;gap:8px}
.mflex .btn{flex:1}

/* 토스트 */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:12px 24px;border-radius:12px;font-size:14px;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}

/* 로딩 */
.ldg{position:fixed;inset:0;background:rgba(255,255,255,.7);z-index:250;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.ldg.show{display:flex}
.spin{width:20px;height:20px;border:3px solid #e2e8f0;border-top-color:var(--pri);border-radius:50%;animation:sp .6s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- 로그인 -->
<div class="page on" id="pg-login">
<div class="lbox">
  <h1>GMP 유틸리티 점검</h1>
  <p>안산 공장 유틸리티 점검 시스템</p>
  <div class="fg">
    <input id="li-n" placeholder="아이디" autocomplete="off">
    <input id="li-p" type="password" placeholder="비밀번호">
    <button class="btn btn1" onclick="login()">로그인</button>
    <button class="btn btn2" onclick="$('reg-f').style.display='flex'">회원가입</button>
    <div class="emsg" id="li-e"></div>
  </div>
  <div class="fg" id="reg-f" style="display:none;margin-top:16px;padding-top:16px;border-top:1px solid #e2e8f0">
    <input id="rn" placeholder="아이디" autocomplete="off">
    <input id="rp" type="password" placeholder="비밀번호">
    <input id="rp2" type="password" placeholder="비밀번호 확인">
    <button class="btn btn1" onclick="register()">가입하기</button>
    <div class="emsg" id="reg-e"></div>
  </div>
</div>
</div>

<!-- 메인 -->
<div class="page" id="pg-main">
  <div class="hdr">
    <h2>GMP 유틸리티 점검</h2>
    <button class="hb" onclick="sync()" title="동기화">🔄</button>
    <button class="hb" onclick="go('pg-set')" title="설정">⚙️</button>
  </div>
  <div class="fsw">
    <button id="fb2" class="on" onclick="setFloor(2)">2F 고형제</button>
    <button id="fb3" onclick="setFloor(3)">3F 액상</button>
  </div>
  <div class="pcard">
    <div class="prow"><div class="pbig" id="pp">0%</div><div class="psub" id="ps">0 / 0</div></div>
    <div class="pbar"><div class="pfill" id="pf" style="width:0%"></div></div>
  </div>
  <div class="tabs">
    <button class="tab on" id="t-map" onclick="setTab('map')">📍 도면</button>
    <button class="tab" id="t-list" onclick="setTab('list')">📋 목록</button>
  </div>
  <div id="mapBox"><canvas id="mc"></canvas>
    <div class="mtb"><button onclick="zm(1.3)">＋</button><button onclick="zm(.7)">－</button><button onclick="zmR()">↺</button></div>
    <div class="popup" id="pop"><h4 id="pop-t"></h4><div id="pop-c"></div><div class="pbtn" id="pop-b"></div></div>
  </div>
  <div id="listBox"></div>
  <button class="fab" id="fab" onclick="togAdd()">📍</button>
</div>

<!-- 설정 -->
<div class="page" id="pg-set">
  <div class="hdr"><button class="hb" onclick="go('pg-main')">←</button><h2>설정</h2></div>
  <div class="spage">
    <div class="scard"><h3>👤 사용자</h3><div id="s-user">-</div>
      <div class="sbtn" style="margin-top:10px"><button class="btn btn2" onclick="logout()">로그아웃</button></div></div>
    <div class="scard"><h3>🔗 Google Sheets</h3>
      <input id="s-url" placeholder="Apps Script URL">
      <div class="sbtn"><button class="btn btn1" onclick="saveUrl()">저장</button><button class="btn btn2" onclick="testUrl()">테스트</button></div>
      <div class="emsg" id="s-msg" style="margin-top:6px"></div></div>
    <div class="scard"><h3>🔧 연결 진단</h3>
      <div class="sbtn"><button class="btn btn1" onclick="runDiag()">전체 진단 실행</button></div>
      <div id="diag-log" style="margin-top:10px;font-size:12px;font-family:monospace;white-space:pre-wrap;background:#f1f5f9;padding:12px;border-radius:8px;max-height:400px;overflow-y:auto;display:none"></div></div>
    <div class="scard" id="s-cat" style="display:none"><h3>📂 카테고리 관리 (<span id="s-cat-floor"></span>)</h3>
      <div id="s-cat-list"></div>
      <div class="sbtn" style="margin-top:10px"><button class="btn btn1" onclick="openM('m-cat')">＋ 추가</button></div></div>
  </div>
</div>

<!-- 모달: 배치 선택 (기존 항목 or 새 항목) -->
<div class="mbg" id="m-pick"><div class="mdl">
  <h3>📍 이 위치에 배치할 항목</h3>
  <div id="pick-list" style="max-height:300px;overflow-y:auto;margin-bottom:12px"></div>
  <div style="border-top:1px solid #e2e8f0;padding-top:12px">
    <button class="btn btn1" style="width:100%" onclick="closeM('m-pick');openM('m-item');fillCatSel()">＋ 새 항목 만들기</button>
  </div>
  <button class="btn btn2" style="width:100%;margin-top:8px" onclick="cancelAdd()">취소</button>
</div></div>

<!-- 모달: 항목 추가 -->
<div class="mbg" id="m-item"><div class="mdl">
  <h3>새 점검 항목 추가</h3>
  <input id="mi-n" placeholder="항목 이름">
  <select id="mi-c"><option value="">카테고리 선택</option></select>
  <div class="mflex"><button class="btn btn2" onclick="cancelAdd()">취소</button><button class="btn btn1" onclick="addItem()">추가</button></div>
</div></div>

<!-- 모달: 카테고리 추가 -->
<div class="mbg" id="m-cat"><div class="mdl">
  <h3>카테고리 추가</h3>
  <input id="mc-n" placeholder="카테고리 이름">
  <div class="mflex"><button class="btn btn2" onclick="closeM('m-cat')">취소</button><button class="btn btn1" onclick="addCat()">추가</button></div>
</div></div>

<div class="toast" id="toast"></div>
<div class="ldg" id="ldg"><div class="spin"></div><p id="ldg-m">로딩...</p></div>

// ★ 단일 API 함수 — 모든 요청을 GET으로 (Google Apps Script 가장 안정적)
async function api(action,data){
  const url=getUrl();
  if(!url)throw new Error('URL 미설정');
  const payload=JSON.stringify({action,...data});
  const fullUrl=url+'?data='+encodeURIComponent(payload);
  try{
    const r=await fetch(fullUrl,{redirect:'follow'});
    const text=await r.text();
    try{return JSON.parse(text);}catch(e){return{ok:true};}
  }catch(e){
    console.warn('api error:',action,e.message);
    throw e;
  }
}

/* --- 자동 동기화 (30초마다) --- */
let syncTimer=null;
function startAutoSync(){
  stopAutoSync();
  syncTimer=setInterval(()=>{
    if(!CU||!getUrl())return;
    silentSync();
  },30000); // 30초
}
function stopAutoSync(){if(syncTimer){clearInterval(syncTimer);syncTimer=null;}}

async function silentSync(){
  try{
    for(const f of [2,3]){
      const j=await api('getData',{floor:f,date:today()});
      D[f].items=j.items||[];
      D[f].categories=j.categories||[];
      D[f].checks=j.checks||[];
    }

}

/* ================================================================

   ================================================================ */
function uProg(){
  const items=D[CF].items, checks=D[CF].checks;
  const total=items.length;
  let done=0;
  items.forEach(it=>{
    if(checks.some(c=>c.itemId===it.itemId&&c.state==='ON'))done++;
  });
  const pct=total>0?Math.round(done/total*100):0;
  $('pp').textContent=pct+'%';
  $('ps').textContent=`${done} / ${total}`;
  $('pf').style.width=pct+'%';
}

/* ================================================================
   도면 렌더링 — 이미지+마커 동일 좌표계, 비율좌표
   ================================================================ */
function loadImg(f){
  return new Promise(r=>{
    if(imgCache[f]){r(imgCache[f]);return;}
    const img=new Image();
    img.onload=()=>{imgCache[f]=img;r(img);};
    img.onerror=()=>r(null);
    img.src=FIMG[f];
  });
}

function pct2px(px,py){return{x:px/100*imgW,y:py/100*imgH};}
function px2pct(x,y){return{x:x/imgW*100,y:y/imgH*100};}
function scr2map(cx,cy){
  const c=$('mc'),r=c.getBoundingClientRect();
  const sx=imgW/r.width, sy=imgH/r.height;
  return{x:((cx-r.left)*sx-ms.ox)/ms.s, y:((cy-r.top)*sy-ms.oy)/ms.s};
}

async function render(){
  const c=$('mc'),ctx=c.getContext('2d');
  const dpr=devicePixelRatio||1;
  const cw=c.parentElement.clientWidth;
  const img=await loadImg(CF);
  let ih=Math.max(cw*.6,400);
  if(img)ih=Math.round(cw*img.naturalHeight/img.naturalWidth);
  imgW=cw;imgH=ih;

  c.width=cw*dpr;c.height=ih*dpr;c.style.height=ih+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cw,ih);ctx.fillStyle='#f0f4f8';ctx.fillRect(0,0,cw,ih);

  ctx.save();
  ctx.translate(ms.ox,ms.oy);ctx.scale(ms.s,ms.s);

  if(img)ctx.drawImage(img,0,0,cw,ih);
  else{ctx.fillStyle='#94a3b8';ctx.font='bold 20px sans-serif';ctx.textAlign='center';ctx.fillText(FN[CF]+' 도면',cw/2,ih/2);}

  // 마커
  const items=D[CF].items, checks=D[CF].checks, r=Math.max(10,cw/55);
  items.forEach(it=>{
    if(it.x==null||it.y==null)return;
    const {x,y}=pct2px(it.x,it.y);
    const hasOn=checks.some(c=>c.itemId===it.itemId&&c.state==='ON');
    const hasOff=checks.some(c=>c.itemId===it.itemId&&c.state==='OFF');

    // 핀
    ctx.beginPath();ctx.moveTo(x-5,y+r-2);ctx.lineTo(x+5,y+r-2);ctx.lineTo(x,y+r+8);ctx.closePath();
    ctx.fillStyle=hasOn?'#16a34a':hasOff?'#dc2626':'#6b7280';ctx.fill();

    // 원
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle=hasOn?'#22c55e':hasOff?'#ef4444':'#94a3b8';ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=2.5;ctx.stroke();

    // 텍스트
    ctx.fillStyle='#fff';ctx.font=`bold ${r*.7|0}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(checks.filter(c=>c.itemId===it.itemId).length||'•',x,y);

    // 라벨: 항목명 + 최근 점검자
    const nm=it.itemName||'';
    const itemChecks=checks.filter(c=>c.itemId===it.itemId);
    const lastChk=itemChecks.length>0?itemChecks[itemChecks.length-1]:null;
    const checkerName=lastChk?`${lastChk.userName} ${lastChk.state}`:'';

    const fs1=Math.max(9,r*.65|0), fs2=Math.max(8,r*.55|0);
    ctx.font=`bold ${fs1}px sans-serif`;ctx.textBaseline='top';ctx.textAlign='center';
    const tw1=ctx.measureText(nm).width;
    ctx.font=`${fs2}px sans-serif`;
    const tw2=checkerName?ctx.measureText(checkerName).width:0;
    const tw=Math.max(tw1,tw2)+12;
    const lh=checkerName?32:16;

    // 라벨 배경
    const lx=x-tw/2,ly=y+r+10;
    ctx.fillStyle='rgba(0,0,0,.75)';
    ctx.beginPath();ctx.moveTo(lx+3,ly);ctx.lineTo(lx+tw-3,ly);ctx.arcTo(lx+tw,ly,lx+tw,ly+3,3);ctx.lineTo(lx+tw,ly+lh-3);ctx.arcTo(lx+tw,ly+lh,lx+tw-3,ly+lh,3);ctx.lineTo(lx+3,ly+lh);ctx.arcTo(lx,ly+lh,lx,ly+lh-3,3);ctx.lineTo(lx,ly+3);ctx.arcTo(lx,ly,lx+3,ly,3);ctx.closePath();ctx.fill();

    // 항목명
    ctx.fillStyle='#fff';ctx.font=`bold ${fs1}px sans-serif`;
    ctx.fillText(nm,x,y+r+12);

    // 최근 점검자
    if(checkerName){
      ctx.fillStyle=lastChk.state==='ON'?'#86efac':'#fca5a5';
      ctx.font=`${fs2}px sans-serif`;
      ctx.fillText(checkerName,x,y+r+26);
    }
  });

  // 미배치 안내
  const noXY=items.filter(i=>i.x==null||i.y==null);
  if(noXY.length>0&&CU?.role==='admin'){
    ctx.restore();ctx.save();
    ctx.fillStyle='rgba(37,99,235,.85)';ctx.fillRect(0,ih-30,cw,30);
    ctx.fillStyle='#fff';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(`📍 위치 미지정 ${noXY.length}개 — 아래 버튼으로 배치`,cw/2,ih-15);
  }

  ctx.restore();

  // FAB
  $('fab').style.display=(CU?.role==='admin')?'block':'none';
  $('mc').style.cursor=addMode?'crosshair':'grab';
}

/* --- 캔버스 이벤트 --- */
function setupMap(){
  const c=$('mc');
  c.addEventListener('pointerdown',e=>{
    e.preventDefault();
    if(addMode){
      const m=scr2map(e.clientX,e.clientY);
      const p=px2pct(m.x,m.y);
      if(p.x<0||p.x>100||p.y<0||p.y>100){toast('도면 안을 터치하세요');return;}
      addXY={x:Math.round(p.x*100)/100,y:Math.round(p.y*100)/100};
      showPickModal();return;
    }
    // 마커 클릭
    const m=scr2map(e.clientX,e.clientY);
    const items=D[CF].items, hr=Math.max(18,imgW/35);
    let hit=null;
    items.forEach(it=>{
      if(it.x==null||it.y==null)return;
      const {x,y}=pct2px(it.x,it.y);
      if(Math.hypot(m.x-x,m.y-y)<hr)hit=it;
    });
    if(hit){showPop(hit,e.clientX,e.clientY);return;}
    hidePop();
    ms.drag=true;ms.sx=e.clientX;ms.sy=e.clientY;ms.lx=ms.ox;ms.ly=ms.oy;
    c.setPointerCapture(e.pointerId);
  });
  c.addEventListener('pointermove',e=>{if(!ms.drag)return;ms.ox=ms.lx+(e.clientX-ms.sx);ms.oy=ms.ly+(e.clientY-ms.sy);render();});
  c.addEventListener('pointerup',e=>{ms.drag=false;c.releasePointerCapture(e.pointerId);});
  c.addEventListener('wheel',e=>{e.preventDefault();ms.s=Math.max(.3,Math.min(5,ms.s*(e.deltaY>0?.9:1.1)));render();},{passive:false});

  let ld=0;
  c.addEventListener('touchstart',e=>{if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;ld=Math.hypot(dx,dy);}},{passive:true});
  c.addEventListener('touchmove',e=>{if(e.touches.length===2&&ld>0){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;const d=Math.hypot(dx,dy);ms.s=Math.max(.3,Math.min(5,ms.s*d/ld));ld=d;render();}},{passive:true});
  c.addEventListener('touchend',()=>{ld=0;},{passive:true});
}

function zm(f){ms.s=Math.max(.3,Math.min(5,ms.s*f));render();}
function zmR(){ms={s:1,ox:0,oy:0,drag:false,sx:0,sy:0,lx:0,ly:0};render();}

  }

    b=`<button style="background:var(--ok);color:#fff" onclick="doChk('${it.itemId}','ON')">🟢 ON</button>
       <button style="background:var(--off);color:#fff" onclick="doChk('${it.itemId}','OFF')">🔴 OFF</button>`;

/* ================================================================
   목록 뷰 — 시트 카테고리 기준 그룹핑
   ================================================================ */
function rList(){
  const el=$('listBox');
  const items=D[CF].items,cats=D[CF].categories,checks=D[CF].checks;
  const isAdm=CU?.role==='admin';

  // 그룹핑
  const g={};
  cats.forEach(c=>{g[c.id]={name:c.name,items:[]};});
  items.forEach(it=>{
    const cid=it.categoryId||'__etc__';
    if(!g[cid])g[cid]={name:it.categoryName||'미분류',items:[]};
    g[cid].items.push(it);
  });

  let html='';
  Object.keys(g).forEach(cid=>{
    const gr=g[cid];if(!gr.items.length)return;
    html+=`<div class="csec"><div class="chdr op" onclick="this.classList.toggle('op');this.nextElementSibling.classList.toggle('op')">
      <span class="a">▶</span>${gr.name}<span class="n">${gr.items.length}개</span></div><div class="cbod op">`;

    gr.items.forEach(it=>{
      const lastChk=checks.find(c=>c.itemId===it.itemId);

      html+=`<div class="irow"><div class="nm">${it.itemName}</div><div class="dots">`;

      if(!lastChk){
        // 미점검
        if(CU?.role==='user'){
          html+=`<div class="dot dnone" onclick="doChk('${it.itemId}','ON')">―</div>`;
        }else{
          html+=`<span style="font-size:12px;color:#94a3b8">미점검</span>`;
        }
      }else{
        // 마지막 상태 표시
        const cls=lastChk.state==='ON'?'don':'doff';
        const next=lastChk.state==='ON'?'OFF':'ON';
        if(CU?.role==='user'){
          html+=`<div class="dot ${cls}" onclick="doChk('${it.itemId}','${next}')">${lastChk.state==='ON'?'O':'X'}</div>`;
        }else{
          html+=`<div class="dot ${cls}" style="cursor:default">${lastChk.state==='ON'?'O':'X'}</div>`;
        }
        html+=`<span style="font-size:11px;color:#64748b;margin-left:4px">${lastChk.userName||''}</span>`;
      }

      html+=`</div>`;
      if(isAdm)html+=`<div class="iadm"><button onclick="delItem('${it.itemId}')">🗑</button></div>`;
      html+=`</div>`;
    });
    html+=`</div></div>`;
  });

  if(!items.length){
    html=`<div style="text-align:center;padding:40px;color:#94a3b8">점검 항목이 없습니다.<br>
      <button class="btn btn1" style="margin-top:16px;font-size:13px;padding:10px 20px" onclick="sync()">🔄 시트에서 불러오기</button></div>`;
  }
  el.innerHTML=html;
}

/* ================================================================
   점검 ON/OFF
   ================================================================ */
async function doChk(itemId,state){
  if(!CU||CU.role==='admin'){toast('관리자는 점검할 수 없습니다.');return;}
  const it=D[CF].items.find(i=>i.itemId===itemId);if(!it)return;
  const time=timeNow(),date=today();

  // 로컬 즉시 반영
  const existing=D[CF].checks.findIndex(c=>c.itemId===itemId);
  const chk={categoryId:it.categoryId,categoryName:it.categoryName,itemId,itemName:it.itemName,userId:CU.id,userName:CU.name,time,state};
  if(existing>=0)D[CF].checks[existing]=chk;else D[CF].checks.push(chk);
  hidePop();render();rList();uProg();saveD();

  // 서버 동기화
  try{await api('check',{floor:CF,date,...chk});}catch(e){toast('동기화 실패: '+e.message);}
}

async function doUnchk(itemId){
  if(!CU)return;
  D[CF].checks=D[CF].checks.filter(c=>c.itemId!==itemId);
  hidePop();render();rList();uProg();saveD();
  try{await api('uncheck',{floor:CF,itemId,userId:CU.id,date:today()});}catch(e){toast('동기화 실패');}
}

  try{await api('deleteCategory',{floor:CF,categoryId:catId});}catch(e){}
}

async function renameCat(catId){
  const name=prompt('새 이름:');if(!name)return;
  const c=D[CF].categories.find(c=>c.id===catId);if(c)c.name=name;
  D[CF].items.forEach(it=>{if(it.categoryId===catId)it.categoryName=name;});
  rSet();rList();saveD();toast('변경됨');
  try{await api('renameCategory',{floor:CF,categoryId:catId,newName:name});}catch(e){}
}

/* ================================================================
   설정 페이지
   ================================================================ */
function rSet(){
  $('s-url').value=getUrl();
  if(CU)$('s-user').innerHTML=`이름: <b>${CU.name}</b><br>역할: ${CU.role==='admin'?'최고관리자':'사용자'}`;
  const sc=$('s-cat');
  if(CU?.role==='admin'){
    sc.style.display='block';
    $('s-cat-floor').textContent=FN[CF];
    let h='';
    D[CF].categories.forEach(c=>{
      const cnt=D[CF].items.filter(i=>i.categoryId===c.id).length;
      h+=`<div style="display:flex;align-items:center;padding:8px 0;border-bottom:1px solid #f1f5f9;gap:8px">
        <span style="flex:1;font-size:14px">${c.name} <span style="color:#94a3b8;font-size:12px">(${cnt})</span></span>
        <button class="btn btn2" style="padding:4px 10px;font-size:12px" onclick="renameCat('${c.id}')">✏️</button>
        <button class="btn btn2" style="padding:4px 10px;font-size:12px;color:var(--off)" onclick="delCat('${c.id}')">🗑</button></div>`;
    });
    if(!D[CF].categories.length)h='<div style="color:#94a3b8;font-size:13px">카테고리 없음</div>';
    $('s-cat-list').innerHTML=h;
  }else sc.style.display='none';
}

function saveUrl(){setUrl($('s-url').value.trim());$('s-msg').textContent='저장됨';$('s-msg').style.color='var(--ok)';toast('URL 저장됨');}
async function testUrl(){
  try{showL('테스트 중...');await api('ping',{});hideL();$('s-msg').textContent='✅ 연결 성공!';$('s-msg').style.color='var(--ok)';}
  catch(e){hideL();$('s-msg').textContent='❌ '+e.message;$('s-msg').style.color='var(--off)';}
}

async function runDiag(){
  const log=$('diag-log');log.style.display='block';log.textContent='';
  const url=getUrl();
  function w(m){log.textContent+=m+'\n';log.scrollTop=log.scrollHeight;}

  w('===== GMP 연결 진단 =====');
  w('URL: '+url);
  w('날짜: '+today());
  w('');

  if(!url){w('❌ URL 미설정');return;}

  w('[1/5] ping...');
  try{
    const payload=JSON.stringify({action:'ping'});
    const r=await fetch(url+'?data='+encodeURIComponent(payload),{redirect:'follow'});
    const text=await r.text();
    w('  상태: '+r.status);
    w('  응답: '+text.substring(0,200));
    try{const j=JSON.parse(text);w('  결과: '+(j.ok?'✅':'❌ '+j.error));}
    catch(e){w('  ❌ JSON 파싱 실패 — Apps Script 배포 설정 확인 (액세스: 모든 사용자)');return;}
  }catch(e){w('  ❌ fetch 실패: '+e.message);return;}
  w('');

  w('[2/5] getData 2F...');
  try{
    const j=await api('getData',{floor:2,date:today()});
    w('  카테고리: '+(j.categories?.length||0)+'개 '+JSON.stringify(j.categories?.map(c=>c.name)||[]));
    w('  항목: '+(j.items?.length||0)+'개');
    w('  체크: '+(j.checks?.length||0)+'건');
  }catch(e){w('  ❌ '+e.message);}
  w('');

  w('[3/5] getData 3F...');
  try{
    const j=await api('getData',{floor:3,date:today()});
    w('  카테고리: '+(j.categories?.length||0)+'개');
    w('  항목: '+(j.items?.length||0)+'개');
    w('  체크: '+(j.checks?.length||0)+'건');
  }catch(e){w('  ❌ '+e.message);}
  w('');

  w('[4/5] check 쓰기...');
  const tid='test_'+Date.now();
  try{
    const j=await api('check',{floor:2,date:today(),categoryId:'diag',categoryName:'진단',itemId:tid,itemName:'진단',userId:'diag',userName:'진단',time:'test',state:'ON'});
    w('  결과: '+JSON.stringify(j));
  }catch(e){w('  ❌ '+e.message);}
  w('');

  w('[5/5] 쓴 데이터 확인...');
  try{
    const j=await api('getData',{floor:2,date:today()});
    const found=j.checks?.find(c=>c.itemId===tid);
    if(found){w('  ✅ 읽기/쓰기 모두 정상!');
    }else{
      w('  ❌ 쓴 데이터를 못 읽음');
      w('  → Code.gs v5.1 (ds함수 포함) 확인');
      w('  → Apps Script "새 버전" 재배포 확인');
    }
    await api('uncheck',{floor:2,itemId:tid,userId:'diag',date:today()});
  }catch(e){w('  ❌ '+e.message);}
  w('\n===== 진단 완료 =====');
}

/* ================================================================
   초기화
   ================================================================ */
window.addEventListener('DOMContentLoaded',()=>{
  setupMap();
  CU=getUser();
  loadD(); // 캐시된 데이터 복원
  if(CU){go('pg-main');if(getUrl()){sync();}else{startAutoSync();}}
  window.addEventListener('resize',()=>{if($('pg-main').classList.contains('on'))render();});
});
</script>
