<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GMP 유틸리티 점검</title>
<style>
:root{--pri:#2563eb;--pri2:#1d4ed8;--bg:#f0f4f8;--card:#fff;--txt:#1e293b;--sub:#64748b;--bdr:#e2e8f0;--ok:#22c55e;--off:#ef4444;--sz:16px;--rad:14px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:var(--sz);color:var(--txt);background:var(--bg);overflow-x:hidden;min-height:100dvh}
.page{display:none;min-height:100dvh}
.page.active{display:flex;flex-direction:column}

/* ===== 로그인 ===== */
#pg-login{justify-content:center;align-items:center;padding:24px;background:linear-gradient(135deg,#1e3a5f 0%,#2563eb 100%)}
.login-box{background:#fff;border-radius:20px;padding:32px 24px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.login-box h1{font-size:22px;text-align:center;margin-bottom:4px;color:#1e293b}
.login-box p{text-align:center;color:#64748b;font-size:13px;margin-bottom:24px}
.fin{display:flex;flex-direction:column;gap:12px}
.fin input{padding:14px 16px;border:1.5px solid #e2e8f0;border-radius:12px;font-size:15px;outline:none;transition:border .2s}
.fin input:focus{border-color:var(--pri)}
.btn{padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-pri{background:var(--pri);color:#fff}
.btn-pri:active{background:var(--pri2);transform:scale(.97)}
.btn-sec{background:#f1f5f9;color:#475569}
.btn-sec:active{background:#e2e8f0}
.err-msg{color:var(--off);font-size:13px;text-align:center;min-height:20px;margin-top:4px}

/* ===== 헤더 ===== */
.hdr{background:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--bdr);position:sticky;top:0;z-index:100}
.hdr h2{font-size:17px;flex:1}
.hdr-btn{width:36px;height:36px;border:none;background:#f1f5f9;border-radius:10px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.hdr-btn:active{background:#e2e8f0}

/* ===== 층 전환 ===== */
.floor-sw{display:flex;background:#f1f5f9;border-radius:10px;padding:3px;margin:12px 16px 0}
.floor-sw button{flex:1;padding:10px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;background:transparent;color:var(--sub);transition:all .2s}
.floor-sw button.active{background:#fff;color:var(--pri);box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* ===== 진행률 ===== */
.prog-card{margin:12px 16px;background:#fff;border-radius:var(--rad);padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.prog-row{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.prog-big{font-size:32px;font-weight:700;color:var(--pri)}
.prog-sub{font-size:13px;color:var(--sub)}
.pbg{height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden}
.pfill{height:100%;background:linear-gradient(90deg,var(--pri),#60a5fa);border-radius:4px;transition:width .4s ease}

/* ===== 탭 ===== */
.tabs{display:flex;margin:12px 16px 0;gap:4px}
.tab{flex:1;padding:10px;border:none;border-radius:10px 10px 0 0;font-size:14px;font-weight:600;cursor:pointer;background:#e2e8f0;color:var(--sub)}
.tab.active{background:#fff;color:var(--pri)}
.tab-body{flex:1;overflow-y:auto;background:#fff}

/* ===== 도면 뷰 ===== */
#map-view{position:relative;touch-action:none;overflow:hidden}
#map-canvas{display:block;width:100%;cursor:grab}
#map-canvas:active{cursor:grabbing}
.map-toolbar{position:absolute;bottom:16px;right:16px;display:flex;flex-direction:column;gap:8px}
.map-toolbar button{width:44px;height:44px;border:none;border-radius:12px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15);font-size:20px;cursor:pointer}
.map-toolbar button:active{background:#f1f5f9}

/* ===== 목록 뷰 ===== */
#list-view{padding:0 0 80px}
.cat-sec{border-bottom:1px solid var(--bdr)}
.cat-hdr{padding:14px 16px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;cursor:pointer;background:#fafbfc}
.cat-hdr .arr{font-size:11px;color:var(--sub);transition:transform .2s}
.cat-hdr.open .arr{transform:rotate(90deg)}
.cat-hdr .cnt{margin-left:auto;font-size:12px;color:var(--sub);font-weight:400}
.cat-body{display:none}
.cat-body.open{display:block}
.item-row{display:flex;align-items:center;padding:12px 16px 12px 28px;border-top:1px solid #f1f5f9;gap:10px}
.item-name{flex:1;font-size:14px}
.item-checks{display:flex;gap:4px;flex-wrap:wrap}
.ck-dot{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;cursor:pointer;transition:transform .1s}
.ck-dot:active{transform:scale(.9)}
.ck-dot.on{background:var(--ok)}
.ck-dot.off{background:var(--off)}
.ck-dot.none{background:#cbd5e1;color:#64748b}
.item-admin{display:flex;gap:4px}
.item-admin button{padding:4px 8px;border:none;border-radius:6px;font-size:11px;cursor:pointer;background:#f1f5f9;color:var(--sub)}
.item-admin button:active{background:#e2e8f0}

/* ===== 설정 ===== */
.set-page{padding:16px;display:flex;flex-direction:column;gap:12px;padding-bottom:80px}
.set-card{background:#fff;border-radius:var(--rad);padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.set-card h3{font-size:15px;margin-bottom:12px}
.set-card input[type=text]{width:100%;padding:12px;border:1.5px solid var(--bdr);border-radius:10px;font-size:14px;margin-bottom:8px}
.set-btns{display:flex;gap:8px;flex-wrap:wrap}
.set-btns .btn{font-size:13px;padding:10px 16px}
.user-info{font-size:13px;color:var(--sub);line-height:1.6}

/* ===== 모달 ===== */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:none;align-items:center;justify-content:center;padding:24px}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:20px;padding:24px;width:100%;max-width:360px}
.modal h3{font-size:17px;margin-bottom:16px}
.modal input{width:100%;padding:12px;border:1.5px solid var(--bdr);border-radius:10px;font-size:14px;margin-bottom:12px}
.modal .mbtn{display:flex;gap:8px}
.modal .mbtn .btn{flex:1}

/* ===== 팝업 ===== */
.popup{position:absolute;z-index:150;background:#fff;border-radius:14px;padding:14px;box-shadow:0 8px 30px rgba(0,0,0,.2);min-width:200px;display:none}
.popup.show{display:block}
.popup h4{font-size:14px;margin-bottom:8px}
.popup .pbtn{display:flex;gap:6px;margin-top:8px}
.popup .pbtn button{flex:1;padding:8px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
.popup .pb-on{background:var(--ok);color:#fff}
.popup .pb-off{background:var(--off);color:#fff}
.popup .pb-cancel{background:#f1f5f9;color:var(--sub)}

/* ===== 토스트 ===== */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:12px 24px;border-radius:12px;font-size:14px;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}

/* ===== FAB ===== */
.fab{position:fixed;bottom:20px;right:20px;width:56px;height:56px;border-radius:16px;background:var(--pri);color:#fff;border:none;font-size:24px;box-shadow:0 4px 16px rgba(37,99,235,.4);cursor:pointer;z-index:90;display:none}
.fab:active{transform:scale(.92)}

/* ===== 로딩 ===== */
.spinner{display:inline-block;width:18px;height:18px;border:2.5px solid #e2e8f0;border-top-color:var(--pri);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,.7);z-index:250;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.loading-overlay.show{display:flex}
.loading-overlay p{font-size:14px;color:var(--sub)}
</style>
</head>
<body>

<!-- ==================== 로그인 ==================== -->
<div class="page active" id="pg-login">
<div class="login-box">
  <h1>GMP 유틸리티 점검</h1>
  <p>안산 공장 유틸리티 점검 시스템</p>
  <div class="fin">
    <input type="text" id="login-name" placeholder="아이디" autocomplete="off">
    <input type="password" id="login-pw" placeholder="비밀번호">
    <button class="btn btn-pri" onclick="doLogin()">로그인</button>
    <button class="btn btn-sec" onclick="showRegister()">회원가입</button>
    <div class="err-msg" id="login-err"></div>
  </div>
  <div class="fin" id="reg-form" style="display:none;margin-top:16px;padding-top:16px;border-top:1px solid #e2e8f0">
    <input type="text" id="reg-name" placeholder="아이디" autocomplete="off">
    <input type="password" id="reg-pw" placeholder="비밀번호">
    <input type="password" id="reg-pw2" placeholder="비밀번호 확인">
    <button class="btn btn-pri" onclick="doRegister()">가입하기</button>
    <div class="err-msg" id="reg-err"></div>
  </div>
</div>
</div>

<!-- ==================== 메인 ==================== -->
<div class="page" id="pg-main">
  <div class="hdr">
    <h2 id="hdr-title">GMP 유틸리티 점검</h2>
    <button class="hdr-btn" onclick="sheetsRefresh()" title="동기화">🔄</button>
    <button class="hdr-btn" onclick="showPage('pg-setting')" title="설정">⚙️</button>
  </div>

  <div class="floor-sw">
    <button id="fbtn-2" class="active" onclick="switchFloor(2)">2F 고형제</button>
    <button id="fbtn-3" onclick="switchFloor(3)">3F 액상</button>
  </div>

  <div class="prog-card">
    <div class="prog-row">
      <div class="prog-big" id="prog-big">0%</div>
      <div class="prog-sub" id="prog-sub">0 / 0</div>
    </div>
    <div class="pbg"><div class="pfill" id="pfill" style="width:0%"></div></div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tab-map" onclick="switchTab('map')">📍 도면</button>
    <button class="tab" id="tab-list" onclick="switchTab('list')">📋 목록</button>
  </div>

  <div class="tab-body" id="map-view">
    <canvas id="map-canvas"></canvas>
    <div class="map-toolbar">
      <button onclick="zoomMap(1.3)">＋</button>
      <button onclick="zoomMap(0.7)">－</button>
      <button onclick="resetMap()">↺</button>
    </div>
  </div>

  <div class="tab-body" id="list-view" style="display:none"></div>

  <!-- 마커 팝업 -->
  <div class="popup" id="marker-popup">
    <h4 id="popup-title">항목명</h4>
    <div id="popup-checks"></div>
    <div class="pbtn" id="popup-btns"></div>
  </div>

  <!-- 관리자 FAB -->
  <button class="fab" id="fab-add" onclick="toggleAddMode()">📍</button>
</div>

<!-- ==================== 설정 ==================== -->
<div class="page" id="pg-setting">
  <div class="hdr">
    <button class="hdr-btn" onclick="showPage('pg-main')">←</button>
    <h2>설정</h2>
  </div>
  <div class="set-page">
    <div class="set-card">
      <h3>👤 사용자 정보</h3>
      <div class="user-info" id="user-info">로그인 필요</div>
      <div class="set-btns" style="margin-top:12px">
        <button class="btn btn-sec" onclick="doLogout()">로그아웃</button>
      </div>
    </div>
    <div class="set-card">
      <h3>🔗 Google Sheets 연동</h3>
      <input type="text" id="set-url" placeholder="Apps Script URL 입력">
      <div class="set-btns">
        <button class="btn btn-pri" onclick="saveUrl()">저장</button>
        <button class="btn btn-sec" onclick="testConn()">테스트</button>
        <button class="btn btn-sec" onclick="clearUrl()">해제</button>
      </div>
      <div class="err-msg" id="set-msg" style="margin-top:8px"></div>
    </div>
    <div class="set-card" id="cat-mgr-card" style="display:none">
      <h3>📂 카테고리 관리</h3>
      <div id="cat-mgr-body"></div>
      <div class="set-btns" style="margin-top:12px">
        <button class="btn btn-pri" onclick="openCatModal()">＋ 카테고리 추가</button>
      </div>
    </div>
    <div class="set-card">
      <h3>🗑 데이터 초기화</h3>
      <div class="set-btns">
        <button class="btn btn-sec" style="color:var(--off)" onclick="resetAll()">전체 초기화</button>
      </div>
    </div>
  </div>
</div>

<!-- ==================== 모달: 카테고리 추가 ==================== -->
<div class="modal-bg" id="modal-cat">
<div class="modal">
  <h3>카테고리 추가</h3>
  <input type="text" id="cat-name-input" placeholder="카테고리 이름">
  <div class="mbtn">
    <button class="btn btn-sec" onclick="closeModal('modal-cat')">취소</button>
    <button class="btn btn-pri" onclick="confirmCat()">추가</button>
  </div>
</div>
</div>

<!-- ==================== 모달: 항목 추가 ==================== -->
<div class="modal-bg" id="modal-item">
<div class="modal">
  <h3>점검 항목 추가</h3>
  <input type="text" id="item-name-input" placeholder="항목 이름">
  <select id="item-cat-select" style="width:100%;padding:12px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:14px;margin-bottom:12px">
    <option value="">미분류</option>
  </select>
  <div class="mbtn">
    <button class="btn btn-sec" onclick="cancelAdd()">취소</button>
    <button class="btn btn-pri" onclick="confirmMark()">추가</button>
  </div>
</div>
</div>

<!-- ==================== 모달: 항목 이름변경 ==================== -->
<div class="modal-bg" id="modal-rename">
<div class="modal">
  <h3>이름 변경</h3>
  <input type="text" id="rename-input" placeholder="새 이름">
  <div class="mbtn">
    <button class="btn btn-sec" onclick="closeModal('modal-rename')">취소</button>
    <button class="btn btn-pri" onclick="confirmRename()">변경</button>
  </div>
</div>
</div>

<!-- ==================== 토스트 ==================== -->
<div class="toast" id="toast"></div>

<!-- ==================== 로딩 ==================== -->
<div class="loading-overlay" id="loading">
  <div class="spinner"></div>
  <p id="loading-msg">동기화 중...</p>
</div>

<script>
/* =========================================================
   GMP 유틸리티 점검 시스템 — 프론트엔드
   전체 수정본: BUG-1~4 + WARN-1~4 해결
   ========================================================= */

const STORAGE_KEY='gmp_v4';
const FLOOR_NAMES={2:'2층 고형제',3:'3층 액상'};
const COLORS=['#3b82f6','#22c55e','#f59e0b','#ef4444','#8b5cf6','#ec4899','#14b8a6','#f97316','#6366f1','#06b6d4'];

let CF=2; // Current Floor
let CU=null; // Current User
let addMode=false;
let addXY=null;
let renameTarget=null;
let mapImg=null;
let mapState={scale:1,ox:0,oy:0,drag:false,sx:0,sy:0,lox:0,loy:0};

/* ---------- localStorage ---------- */
function gdb(){
  try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||defaultDb();}
  catch(e){return defaultDb();}
}
function sdb(db){localStorage.setItem(STORAGE_KEY,JSON.stringify(db));}
function defaultDb(){return{users:[],items:{2:[],3:[]},categories:{2:[],3:[]},checks:{},url:'',version:4};}

/* ---------- 날짜 ---------- */
function td(){
  const d=new Date(),y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}
function timeNow(){
  const d=new Date();
  let h=d.getHours(),m=String(d.getMinutes()).padStart(2,'0');
  const ap=h>=12?'오후':'오전';
  if(h>12)h-=12;if(h===0)h=12;
  return `${ap} ${h}:${m}`;
}

/* ---------- 체크 데이터 ---------- */
function checkKey(itemId,date){return `${itemId}_${date}`;}
function getChecks(itemId,date){
  const db=gdb();
  return db.checks[checkKey(itemId,date)]||[];
}
function setCheck(itemId,date,userId,userName,time,state,color){
  const db=gdb(),key=checkKey(itemId,date);
  if(!db.checks[key])db.checks[key]=[];
  const arr=db.checks[key];
  const idx=arr.findIndex(c=>c.userId===userId);
  if(idx>=0){
    arr[idx]={userId,userName,time,state,color};
  }else{
    arr.push({userId,userName,time,state,color});
  }
  sdb(db);
}
function removeCheck(itemId,date,userId){
  const db=gdb(),key=checkKey(itemId,date);
  if(!db.checks[key])return;
  db.checks[key]=db.checks[key].filter(c=>c.userId!==userId);
  if(db.checks[key].length===0)delete db.checks[key];
  sdb(db);
}

/* ---------- 페이지 관리 ---------- */
function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(id==='pg-main'){render();renderList();updateProg();}
  if(id==='pg-setting')renderSettings();
}

function showRegister(){document.getElementById('reg-form').style.display='flex';}

/* ---------- 토스트 ---------- */
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

/* ---------- 모달 ---------- */
function closeModal(id){document.getElementById(id).classList.remove('show');}
function openModal(id){document.getElementById(id).classList.add('show');}

/* ---------- 로딩 ---------- */
function showLoading(msg){
  document.getElementById('loading-msg').textContent=msg||'처리 중...';
  document.getElementById('loading').classList.add('show');
}
function hideLoading(){document.getElementById('loading').classList.remove('show');}

/* ================================================================
   로그인 / 회원가입
   ================================================================ */
async function doLogin(){
  const name=document.getElementById('login-name').value.trim();
  const pw=document.getElementById('login-pw').value;
  const errEl=document.getElementById('login-err');
  if(!name||!pw){errEl.textContent='아이디와 비밀번호를 입력하세요.';return;}

  // admin 로컬 로그인
  if(name==='admin'&&pw==='admin1234'){
    CU={id:'admin',name:'최고관리자',role:'superadmin',color:'#1e293b'};
    const db=gdb();
    if(!db.users.find(u=>u.name==='최고관리자'))db.users.push({id:'admin',name:'최고관리자',pw:'admin1234',role:'superadmin',color:'#1e293b',joinDate:td()});
    sdb(db);
    errEl.textContent='';
    showPage('pg-main');
    sheetsRefresh();
    return;
  }

  // 시트 로그인
  const url=gdb().url;
  if(url){
    try{
      showLoading('로그인 중...');
      const params=new URLSearchParams({data:JSON.stringify({action:'login',name,password:pw})});
      const r=await fetch(url+'?'+params,{method:'GET'});
      const data=await r.json();
      hideLoading();
      if(data.ok){
        const uid='u'+Date.now();
        CU={id:uid,name,role:'manager',color:COLORS[Math.floor(Math.random()*COLORS.length)]};
        const db=gdb();
        if(!db.users.find(u=>u.name===name)){
          db.users.push({id:uid,name,role:'manager',color:CU.color,joinDate:data.user?.joinDate||td()});
          sdb(db);
        }else{
          const u=db.users.find(u=>u.name===name);
          CU.id=u.id;CU.color=u.color;
        }
        errEl.textContent='';
        showPage('pg-main');
        sheetsRefresh();
        return;
      }else{
        errEl.textContent=data.error||'로그인 실패';return;
      }
    }catch(e){hideLoading();errEl.textContent='서버 연결 실패: '+e.message;return;}
  }

  // 로컬 로그인
  const db=gdb();
  const u=db.users.find(u=>u.name===name);
  if(u){
    CU={id:u.id,name:u.name,role:u.role||'manager',color:u.color||'#94a3b8'};
    errEl.textContent='';
    showPage('pg-main');
  }else{
    errEl.textContent='등록되지 않은 아이디입니다.';
  }
}

async function doRegister(){
  const name=document.getElementById('reg-name').value.trim();
  const pw=document.getElementById('reg-pw').value;
  const pw2=document.getElementById('reg-pw2').value;
  const errEl=document.getElementById('reg-err');
  if(!name||!pw){errEl.textContent='아이디와 비밀번호를 입력하세요.';return;}

  const db=gdb();
  if(db.users.find(u=>u.name===name)){errEl.textContent='이미 존재하는 아이디입니다.';return;}

  const url=db.url;

  const uid='u'+Date.now();
  db.users.push({id:uid,name,pw,role:'manager',color:COLORS[db.users.length%COLORS.length],joinDate:td()});
  sdb(db);
  errEl.textContent='';

/* ================================================================
   도면 뷰 (Canvas)
   ================================================================ */
function loadMapImage(){
  // 도면 이미지 — 실제 이미지 URL이 있다면 교체
  // 기본적으로 빈 캔버스에 그리드 표시
  const canvas=document.getElementById('map-canvas');
  const ctx=canvas.getContext('2d');
  const w=canvas.parentElement.clientWidth;
  const h=Math.max(w*0.75,400);
  canvas.width=w*2;canvas.height=h*2;
  canvas.style.height=h+'px';
  ctx.scale(2,2);
  return{w,h};
}

function render(){
  const canvas=document.getElementById('map-canvas');
  const ctx=canvas.getContext('2d');
  const {w,h}=loadMapImage();

  ctx.save();
  ctx.clearRect(0,0,w,h);

  // 배경
  ctx.fillStyle='#f8fafc';
  ctx.fillRect(0,0,w,h);

  ctx.translate(mapState.ox,mapState.oy);
  ctx.scale(mapState.scale,mapState.scale);

  // 그리드
  ctx.strokeStyle='#e2e8f0';ctx.lineWidth=0.5;
  for(let x=0;x<w;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
  for(let y=0;y<h;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}

  // 층 이름
  ctx.fillStyle='#cbd5e1';ctx.font='bold 24px sans-serif';ctx.textAlign='center';
  ctx.fillText(FLOOR_NAMES[CF]+' 도면',w/2,40);

  // 마커 그리기
  const db=gdb(),its=db.items[CF]||[],day=td();
  its.forEach(item=>{
    if(item.x==null||item.y==null)return;
    const checks=getChecks(item.id,day);
    const hasOn=checks.some(c=>c.state==='ON');
    const hasOff=checks.some(c=>c.state==='OFF');

    const x=item.x,y=item.y;
    const r=14;

    // 마커 원
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle=hasOn?'#22c55e':hasOff?'#ef4444':'#94a3b8';
    ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();

    // 이름
    ctx.fillStyle='#1e293b';ctx.font='11px sans-serif';ctx.textAlign='center';
    ctx.fillText(item.name,x,y+r+14);

    // 체크 수 배지
    if(checks.length>0){
      ctx.fillStyle='#fff';ctx.font='bold 10px sans-serif';
      ctx.fillText(checks.length,x,y+4);
    }
  });

  ctx.restore();

  // 관리자 FAB 표시
  const fab=document.getElementById('fab-add');
  if(CU&&(CU.role==='superadmin'))fab.style.display='block';
  else fab.style.display='none';
}

// --- 캔버스 이벤트 ---
function setupCanvas(){
  const canvas=document.getElementById('map-canvas');

  canvas.addEventListener('pointerdown',e=>{
    if(addMode){
      const rect=canvas.getBoundingClientRect();
      const sx=canvas.width/2/rect.width;
      const x=(e.clientX-rect.left-mapState.ox/1)*sx/mapState.scale;
      const y=(e.clientY-rect.top-mapState.oy/1)*sx/mapState.scale;
      addXY={x:Math.round(x),y:Math.round(y)};
      openModal('modal-item');
      populateCatSelect();
      return;
    }

    const rect=canvas.getBoundingClientRect();
    const sx=canvas.width/2/rect.width;
    const cx=(e.clientX-rect.left)*sx;
    const cy=(e.clientY-rect.top)*sx;
    const mx=(cx-mapState.ox)/mapState.scale;
    const my=(cy-mapState.oy)/mapState.scale;

    // 마커 클릭 감지
    const db=gdb(),its=db.items[CF]||[];
    let hit=null;
    its.forEach(item=>{
      if(item.x==null||item.y==null)return;
      const dx=mx-item.x,dy=my-item.y;
      if(Math.sqrt(dx*dx+dy*dy)<20)hit=item;
    });

    if(hit){
      showMarkerPopup(hit,e.clientX,e.clientY);
      return;
    }

    hidePopup();
    mapState.drag=true;mapState.sx=e.clientX;mapState.sy=e.clientY;
    mapState.lox=mapState.ox;mapState.loy=mapState.oy;
  });

  canvas.addEventListener('pointermove',e=>{
    if(!mapState.drag)return;
    mapState.ox=mapState.lox+(e.clientX-mapState.sx);
    mapState.oy=mapState.loy+(e.clientY-mapState.sy);
    render();
  });

  canvas.addEventListener('pointerup',()=>{mapState.drag=false;});
  canvas.addEventListener('pointerleave',()=>{mapState.drag=false;});
}

function zoomMap(f){
  mapState.scale=Math.max(0.3,Math.min(5,mapState.scale*f));
  render();
}
function resetMap(){
  mapState={scale:1,ox:0,oy:0,drag:false,sx:0,sy:0,lox:0,loy:0};
  render();
}

function renderList(){
  const el=document.getElementById('list-view');
  const db=gdb(),its=db.items[CF]||[],cats=db.categories[CF]||[],day=td();
  const isAdmin=CU&&CU.role==='superadmin';

  // 카테고리별 그룹핑
  const groups={};
  cats.forEach(c=>{if(!groups[c.id])groups[c.id]={name:c.name,items:[]};});
  if(!groups[''])groups['']={name:'미분류',items:[]};

  its.forEach(item=>{
    const cid=item.categoryId||'';
    if(!groups[cid])groups[cid]={name:item.categoryName||'미분류',items:[]};
    groups[cid].items.push(item);
  });

  let html='';
  Object.keys(groups).forEach(cid=>{
    const g=groups[cid];
    if(g.items.length===0&&cid!=='')return;
    html+=`<div class="cat-sec">
      <div class="cat-hdr open" onclick="this.classList.toggle('open');this.nextElementSibling.classList.toggle('open')">
        <span class="arr">▶</span>${g.name}<span class="cnt">${g.items.length}개</span>
      </div>
      <div class="cat-body open">`;

    g.items.forEach(item=>{
      const checks=getChecks(item.id,day);
      const db2=gdb();
      const members=db2.users.filter(u=>u.role!=='superadmin');

      html+=`<div class="item-row">
        <div class="item-name">${item.name}</div>
        <div class="item-checks">`;

      if(CU&&CU.role!=='superadmin'){
        const myCheck=checks.find(c=>c.userId===CU.id);
        if(!myCheck){
          html+=`<div class="ck-dot none" onclick="doCheck('${item.id}','ON')" title="점검하기">―</div>`;
        }else{
          const cls=myCheck.state==='ON'?'on':'off';
          const nextState=myCheck.state==='ON'?'OFF':'ON';
          html+=`<div class="ck-dot ${cls}" onclick="doCheck('${item.id}','${nextState}')" title="${myCheck.state}">${myCheck.state==='ON'?'O':'X'}</div>`;
        }
      }

      // 다른 사람 체크 표시
      checks.forEach(c=>{
        if(CU&&c.userId===CU.id)return;
        const cls=c.state==='ON'?'on':'off';
        html+=`<div class="ck-dot ${cls}" style="background:${c.color||'#94a3b8'};width:24px;height:24px;font-size:9px" title="${c.userName}: ${c.state}">${c.userName?.charAt(0)||'?'}</div>`;
      });

      html+=`</div>`;

      if(isAdmin){
        html+=`<div class="item-admin">
          <button onclick="startRename('${item.id}')">✏️</button>
          <button onclick="deleteItem('${item.id}')">🗑</button>
        </div>`;
      }

      html+=`</div>`;
    });

    html+=`</div></div>`;
  });

  if(its.length===0){
    html='<div style="text-align:center;padding:40px;color:#94a3b8">점검 항목이 없습니다.<br>관리자가 항목을 추가해주세요.</div>';
  }

  el.innerHTML=html;
}

async function doCheck(itemId,state){
  if(!CU||CU.role==='superadmin'){toast('관리자는 점검할 수 없습니다.');return;}

  const day=td(),time=timeNow();
  const db=gdb();
  const item=db.items[CF]?.find(i=>i.id===itemId);
  if(!item)return;

  // 로컬 저장 (UPSERT)
  setCheck(itemId,day,CU.id,CU.name,time,state,CU.color);

  hidePopup();
  render();renderList();updateProg();

  // 시트 동기화
  await syncCheck({
    floor:CF,floorName:FLOOR_NAMES[CF],
    categoryId:item.categoryId||'',categoryName:item.categoryName||'미분류',
    itemId,itemName:item.name,
    userId:CU.id,userName:CU.name,
    date:day,time,state
  });
}

async function doUncheck(itemId){
  if(!CU)return;
  const day=td();
  removeCheck(itemId,day,CU.id);
  hidePopup();
  render();renderList();updateProg();
  await syncUncheck({floor:CF,itemId,userId:CU.id,date:day});
}

function getUrl(){return gdb().url;}

async function syncCheck(data){
  const url=getUrl();if(!url)return;
  try{
    await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({action:'check',...data})});
  }catch(e){console.warn('syncCheck err:',e);}
}

async function syncUncheck(data){
  const url=getUrl();if(!url)return;
  try{
    await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({action:'uncheck',...data})});
  }catch(e){console.warn('syncUncheck err:',e);}
}

// BUG-4 수정: x,y 좌표 포함
async function syncItem(item){
  const url=getUrl();if(!url)return;
  try{
    await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({
        action:'addItem',floor:CF,
        categoryId:item.categoryId||'',categoryName:item.categoryName||'미분류',
        itemId:item.id,itemName:item.name,
        createdBy:item.createdBy||CU?.name||'',
        createdAt:item.createdAt||td(),
        x:item.x!=null?item.x:'',
        y:item.y!=null?item.y:''
      })});
  }catch(e){console.warn('syncItem err:',e);}
}

async function syncDelItem(floor,itemId){
  const url=getUrl();if(!url)return;
  try{
    await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({action:'deleteItem',floor:floor||CF,itemId})});
  }catch(e){console.warn('syncDelItem err:',e);}
}

// BUG-4 수정: items에 x,y 포함
async function syncCatsAndItems(){
  const url=getUrl();if(!url)return;
  const db=gdb();
  try{
    await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({
        action:'syncItems',
        floor:CF,
        floorName:FLOOR_NAMES[CF],
        items:(db.items[CF]||[]).map(i=>({
          id:i.id,name:i.name,
          categoryId:i.categoryId||'',categoryName:i.categoryName||'미분류',
          createdBy:i.createdBy||'',createdAt:i.createdAt||'',
          x:i.x!=null?i.x:'',y:i.y!=null?i.y:''
        })),
        categories:(db.categories[CF]||[]).map(c=>({id:c.id,name:c.name}))
      })});
  }catch(e){console.warn('syncCatsAndItems err:',e);}
}

// BUG-2 수정: syncAllItems 정의 (syncCatsAndItems로 위임)
async function syncAllItems(floor){
  const savedFloor=CF;
  CF=floor||CF;
  await syncCatsAndItems();
  CF=savedFloor;
}

/* ================================================================
   BUG-3 수정: sheetsRefresh — items + categories도 읽기
   ================================================================ */
async function sheetsRefresh(){
  const url=getUrl();
  if(!url){toast('Google Sheets URL이 설정되지 않았습니다.');return;}

  showLoading('데이터 동기화 중...');
  try{
    const params=new URLSearchParams({data:JSON.stringify({action:'getAllData',date:td(),floor:CF})});
    const r=await fetch(url+'?'+params,{method:'GET'});
    const data=await r.json();
    hideLoading();
    if(!data.ok){toast('동기화 실패: '+(data.error||''));return;}

    const db=gdb(),day=td();

    // (A) 회원 동기화
    (data.members||[]).forEach(m=>{
      if(!m.name)return;
      const existing=db.users.find(u=>u.name===m.name);
      if(!existing){
        db.users.push({
          id:'u'+Date.now()+'_'+Math.random().toString(36).substr(2,4),
          name:m.name,pw:m.password||'',
          role:'manager',
          color:COLORS[db.users.length%COLORS.length],
          joinDate:m.joinDate||''
        });
      }
    });

    // (B) 체크 동기화 — 해당 날짜 체크 데이터 교체
    // 먼저 현재 층의 오늘 체크를 클리어
    Object.keys(db.checks).forEach(key=>{
      if(key.endsWith('_'+day)){
        const itemId=key.replace('_'+day,'');
        const belongsToFloor=(db.items[CF]||[]).some(i=>i.id===itemId);
        if(belongsToFloor)delete db.checks[key];
      }
    });

    (data.checks||[]).forEach(ck=>{
      if(!ck.itemId)return;
      const member=db.users.find(u=>u.id===ck.userId||u.name===ck.userName);
      const color=member?member.color:'#94a3b8';
      const uid=member?member.id:(ck.userId||'unknown');
      setCheckDirect(db,ck.itemId,day,uid,ck.userName||'',ck.time||'',ck.state||'ON',color);
    });

    // (C) BUG-3 수정: items 동기화
    if(data.items&&data.items.length>0){
      db.items[CF]=data.items.map(it=>({
        id:it.itemId||it.id||'',
        name:it.itemName||it.name||'',
        floor:CF,
        categoryId:it.categoryId||'',
        categoryName:it.categoryName||'미분류',
        x:it.x!=null?Number(it.x):null,
        y:it.y!=null?Number(it.y):null,
        createdBy:it.createdBy||'',
        createdAt:it.createdAt||''
      }));
    }

    // (D) BUG-3 수정: categories 동기화
    if(data.categories&&data.categories.length>0){
      db.categories[CF]=data.categories.map(c=>({
        id:c.categoryId||c.id||'',
        name:c.categoryName||c.name||'',
        floor:CF
      }));
    }

    sdb(db);
    render();renderList();updateProg();
    toast('동기화 완료!');

  }catch(e){
    hideLoading();
    toast('동기화 오류: '+e.message);
    console.error('sheetsRefresh error:',e);
  }
}

// setCheck 내부용 (db 객체 직접 전달)
function setCheckDirect(db,itemId,date,userId,userName,time,state,color){
  const key=checkKey(itemId,date);
  if(!db.checks[key])db.checks[key]=[];
  const arr=db.checks[key];
  const idx=arr.findIndex(c=>c.userId===userId);
  if(idx>=0){
    arr[idx]={userId,userName,time,state,color};
  }else{
    arr.push({userId,userName,time,state,color});
  }
}
